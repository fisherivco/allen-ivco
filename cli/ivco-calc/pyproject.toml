[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ivco-calc"
version = "0.3.0"
description = "IVCO calculation engine — three-tier calibration + three-stage DCF + Supabase storage"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "certifi>=2024.0.0"]

[project.optional-dependencies]
db = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.0", "pytest-cov"]
all = ["psycopg2-binary>=2.9"]

[project.scripts]
ivco = "ivco_calc.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
